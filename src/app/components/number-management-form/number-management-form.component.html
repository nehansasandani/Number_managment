<div class="nm-form-card">
  <div class="form-header">
    <span class="form-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
      </svg>
    </span>
    <div>
      <h1>Number Management</h1>
      <p>Select the number block you wish to allocate.</p>
    </div>
  </div>

  <div class="form-field">
    <label>Number Levels <span class="required">*</span></label>
    <select [(ngModel)]="selectedNumberLevel">
      <option value="">( FTTH xxx2, LTE xxx3, Lankabell xxx5 )</option>
    </select>
  </div>

  <div class="form-field">
    <label>LEA<span class="required">*</span></label>
    <select [(ngModel)]="selectedLEA">
      <option value="">Select LEA</option>
    </select>
  </div>

  <button class="search-btn" (click)="onSearch()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Search
  </button>
</div>
